<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LR8</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="box">
        <div class="player">
            <p id="playerName">Your name</p>
            <p id="playerWinCount">Wins: 0</p>
            <p class="score" id="playerScore">Score: 0</p>
            
        </div>
        <div class="center">
            <button id="btn">Play</button>
        </div>
        <div class="computer">
            <p>Computer</p>
            <p id="aiWinCount">Wins: 0</p>
            <p class="score" id="aiScore">Score: 0</p>
        </div>
    </div>
</body>
</html>
